<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pre-Flight Checklist Drone Spraying</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      max-width: 800px;
    }

    h2 {
      text-align: center;
    }

    .section {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }

    .checklist label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0;
    }

    button {
      padding: 10px 15px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: darkgreen;
    }
  </style>
</head>

<body>

<h2>PRE-FLIGHT CHECKLIST<br>DRONE SPRAYING</h2>

<form id="checklistForm">

  <!-- Operator -->
  <div class="section">
    <h3>👨‍✈️ Informasi Operator</h3>

    <label>Nama Operator</label>
    <input type="text" name="operator" required>

    <label>Tanggal</label>
    <input type="date" name="tanggal" required>

    <label>Lokasi Operasi</label>
    <input type="text" name="lokasi" required>
  </div>

  <!-- Drone Condition -->
  <div class="section checklist">
    <h3>🚁 Kondisi Drone</h3>

    <label><input type="checkbox"> Baterai drone terisi penuh</label>
    <label><input type="checkbox"> Propeller tidak rusak</label>
    <label><input type="checkbox"> Motor berfungsi normal</label>
    <label><input type="checkbox"> Tanki spray bersih & tidak bocor</label>
    <label><input type="checkbox"> GPS terkoneksi</label>
    <label><input type="checkbox"> Kamera / sensor berfungsi</label>
  </div>

  <!-- Weather -->
  <div class="section">
    <h3>🌤️ Kondisi Cuaca</h3>

    <label>Kecepatan angin</label>
    <input type="text" name="angin" placeholder="contoh: 5 km/jam">

    <label>Cuaca</label>
    <input type="text" name="cuaca" placeholder="cerah / berawan / hujan">

    <label>Catatan</label>
    <textarea name="catatan"></textarea>
  </div>

  <!-- Safety -->
  <div class="section checklist">
    <h3>🛡️ Safety Check</h3>

    <label><input type="checkbox"> Area steril dari orang</label>
    <label><input type="checkbox"> Operator memakai APD</label>
    <label><input type="checkbox"> Jalur penerbangan aman</label>
    <label><input type="checkbox"> Emergency plan siap</label>
  </div>

  <button type="submit">Submit Checklist</button>

</form>

</body>
</html>
