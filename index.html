<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  }

  .container {
    max-width: 520px;
    margin: 30px auto;
    background: #ffffff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  }

  h2 {
    text-align: center;
    color: #2c5364;
  }

  label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
    color: #333;
  }

  input, select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
    transition: 0.2s;
  }

  input:focus, select:focus {
    border-color: #2c5364;
    outline: none;
    box-shadow: 0 0 5px rgba(44,83,100,0.5);
  }

  /* CHECKLIST ROW */
  .check-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }

  .check-name {
    font-weight: bold;
    font-size: 14px;
    flex: 1;
    color: #333;
  }

  .check-options {
    display: flex;
    gap: 6px;
  }

  .check-options input {
    display: none;
  }

  .check-options label {
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    border: 1px solid #ccc;
    user-select: none;
    transition: 0.2s;
    background: #f5f5f5;
  }

  /* OK = HIJAU MODERN */
  .check-options input.ok:checked + label.ok {
    background: linear-gradient(135deg, #00b09b, #96c93d);
    color: white;
    border: none;
  }

  /* NOT OK = MERAH MODERN */
  .check-options input.notok:checked + label.notok {
    background: linear-gradient(135deg, #ff416c, #ff4b2b);
    color: white;
    border: none;
  }

  button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #00b09b, #96c93d);
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    transition: 0.3s;
  }

  button:hover {
    transform: scale(1.03);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  #result {
    margin-top: 15px;
    color: #00b09b;
    font-weight: bold;
    text-align: center;
  }
</style>
